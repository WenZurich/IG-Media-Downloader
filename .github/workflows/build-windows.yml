name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --force-reinstall -r requirements-build.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "IG-Media-Downloader" --collect-all gallery_dl --collect-all customtkinter --collect-all playwright app.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IG-Media-Downloader-Windows
          path: dist/IG-Media-Downloader.exe

      - name: Publish stable latest EXE
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --target "$env:GITHUB_SHA" --title "Latest Windows Build" --notes "Automatically built Windows executable."
          }
          gh release upload latest "dist/IG-Media-Downloader.exe" --clobber
